# Build image Docker otomatis setiap ada perubahan di branch main,
# lalu simpan di GitHub Container Registry: ghcr.io/<username>/<nama-repo>:latest
name: Build Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      # Uji cepat: jalankan image & pastikan halaman utama bisa dibuka
      - name: Smoke test
        run: |
          IMAGE=$(echo "ghcr.io/${{ github.repository }}:latest" | tr '[:upper:]' '[:lower:]')
          docker pull "$IMAGE"
          check() {   # $1 = env tambahan, $2 = daftar halaman
            docker rm -f agc >/dev/null 2>&1 || true
            docker run -d --name agc -p 8080:80 -e CRON_ENABLED=0 -e SITE_URL=http://localhost:8080 $1 "$IMAGE" >/dev/null
            for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8080/robots.txt && break; sleep 2; done
            for p in $2; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$p")
              echo "[$1] $p -> $code"
              if [ "$code" != "200" ]; then
                echo "::error title=Smoke test::[$1] $p -> $code | $(docker logs agc 2>&1 | tail -5 | tr '\n' ' ')"
                exit 1
              fi
            done
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/video/tidak-ada)
            echo "[$1] /video/tidak-ada -> $code"
            [ "$code" = "404" ] || { echo "::error title=Smoke test::[$1] 404 page -> $code"; exit 1; }
          }
          check "-e SITE_LANG=en" "/ /latest /series /privacy /robots.txt /sitemap.xml /assets/style.css"
          check "-e SITE_LANG=de -e SITE_NICHE=Software-Tutorials" "/ /latest /privacy /impressum /sitemap-pages-1.xml"
